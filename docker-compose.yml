version: '3.8'

services:

  # POSTGRES - Banco de metadados do Airflow
  postgres:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  # AIRFLOW INIT
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: "7k9UEHNiJ1cxWy29L8660QR9WfqyiIO4tTIJc2-C_fo="
      AIRFLOW__WEBSERVER__SECRET_KEY: "gn672Ad4CF8N6TK"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__LOGGING__REMOTE_LOGGING: "False"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
      _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-apache-spark[pyspark]==5.6.0"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYSPARK_PYTHON: /usr/bin/python3
      PYSPARK_DRIVER_PYTHON: /usr/bin/python3
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./storage:/storage
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./receita_spark:/opt/airflow/receita_spark
      - ./receita:/opt/airflow/receita
      - ./dados_temp:/opt/airflow/dados_temp
      - receita_data:/opt/airflow/data_receita
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "======================================"
        echo "Inicializando Airflow"
        echo "======================================"
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin \
          || true
        echo "======================================"
        echo "Airflow inicializado"
        echo "======================================"

  # AIRFLOW WEBSERVER
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=fernet_key_aqui
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./receita_spark:/opt/airflow/receita_spark
      - ./receita:/opt/airflow/receita
      - ./dados_temp:/opt/airflow/dados_temp
    ports:
      - "8081:8080"
    command: webserver

  # AIRFLOW SCHEDULER
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./receita_spark:/opt/airflow/receita_spark
      - ./receita:/opt/airflow/receita
      - ./dados_temp:/opt/airflow/dados_temp
    command: scheduler

  # SPARK MASTER
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: custom-spark:3.5.1
    container_name: docker-spark-master-1
    restart: unless-stopped
    environment:
      PYSPARK_PYTHON: /usr/bin/python3
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./dados_temp:/opt/airflow/dados_temp
    ports:
      - "7077:7077"
      - "8080:8080"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "0.0.0.0", "--port", "7077"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/spark/bin/spark-submit --version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: custom-spark:3.5.1
    container_name: docker-spark-worker-1-1
    restart: unless-stopped
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      PYSPARK_PYTHON: /usr/bin/python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./dados_temp:/opt/airflow/dados_temp
    depends_on:
      - spark-master

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: custom-spark:3.5.1
    container_name: docker-spark-worker-2-1
    restart: unless-stopped
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      PYSPARK_PYTHON: /usr/bin/python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./dados_temp:/opt/airflow/dados_temp
    depends_on:
      - spark-master

  # MINIO
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # STORAGE
  storage:
    image: alpine:3.20
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        mkdir -p \
          /storage/raw \
          /storage/processed \
          /storage/temp \
          /storage/archive
        echo "======================================"
        echo "Storage iniciado"
        echo "======================================"
        ls -lah /storage
        tail -f /dev/null
    volumes:
      - ./storage:/storage

  # RECEITA DOWNLOADER
  receita-downloader:
    image: python:3.12-slim
    restart: unless-stopped
    volumes:
      - receita_data:/data
      - ./scripts:/scripts
      - ./dados_temp:/dados_temp
    working_dir: /scripts
    command:
      - python
      - -c
      - |
        import time
        print("Receita Downloader iniciado")
        while True:
            time.sleep(3600)

volumes:
  postgres_data:
  minio_data:
  receita_data: